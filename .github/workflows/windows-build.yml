name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gold-silver-value-calculator-german-v2.2.py
      - Gold-Silber-Rechner.spec
      - gold-silber-icon.ico
      - version-info.txt
      - requirements.txt
      - packaging/windows7-runtime-hook.py
      - packaging/requirements-windows7.txt
      - .github/workflows/windows-build.yml

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows11
            python: '3.13'
            architecture: x64
            filename: Gold-Silver-Calculator-2.4-Windows-x64.exe
          - target: Windows7
            python: '3.8.10'
            architecture: x86
            filename: Gold-Silver-Calculator-2.4-Windows7-x86.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Install dependencies
        shell: pwsh
        run: |
          if ('${{ matrix.target }}' -eq 'Windows7') {
            python -m pip install -r packaging/requirements-windows7.txt
          } else {
            python -m pip install -r requirements.txt pyinstaller==6.22.2
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Verify application calculation and time zone data
        shell: pwsh
        run: |
          @'
          import runpy, sys
          if sys.version_info < (3, 9):
              runpy.run_path('packaging/windows7-runtime-hook.py')
          from decimal import Decimal
          app = runpy.run_path('gold-silver-value-calculator-german-v2.2.py')
          assert app['__version__'] == '2.4'
          assert app['eingabe_lesen']('1.234,56', 'Test') == Decimal('1234.56')
          assert app['kursstand_formatieren']('2026-11-08T12:00:00Z') == '08.11.2026, 13:00 Uhr'
          class Field:
              def __init__(self, value=''): self.value = value
              def get(self): return self.value
              def set(self, value): self.value = value
          ns = app['berechnen'].__globals__
          for name, value in dict(unzenpreis_eingabe='31,1034768', gewicht_eingabe='100', feinheit_variable='800', ergebnis_variable='', status_variable='').items():
              ns[name] = Field(value)
          class Metal:
              def current(self): return 0
          ns['metall_auswahl'] = Metal()
          ns['waehrung_auswahl'] = Field('EUR — Euro')
          ns['gewichtseinheit_auswahl'] = Field('Gramo (g)')
          app['berechnen']()
          assert ns['ergebnis_variable'].get().startswith('80,00 €')
          ns['sprache'] = 'es'
          assert app['eingabe_lesen']('1,234.56', 'Dato') == Decimal('1234.56')
          app['berechnen']()
          assert ns['ergebnis_variable'].get().startswith('80,00 EUR')
          assert 'Peso de metal puro' in ns['ergebnis_variable'].get()
          ns['sprache'] = 'en'
          ns['waehrung_auswahl'] = Field('USD — US dollar')
          ns['gewichtseinheit_auswahl'] = Field('Gram (g)')
          ns['unzenpreis_eingabe'] = Field('31.1034768')
          assert app['eingabe_lesen']('1,234.56', 'Weight') == Decimal('1234.56')
          app['berechnen']()
          assert ns['ergebnis_variable'].get().startswith('$80.00')
          print('PASS: all three languages, number formats and Europe/Berlin time zone')
          '@ | python -
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm Gold-Silber-Rechner.spec
      - name: Smoke test executable GUI
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'standalone-gsr'
          New-Item -ItemType Directory -Path $testDir | Out-Null
          Copy-Item 'dist/Gold-Silber-Rechner.exe' -Destination $testDir
          $exe = Join-Path $testDir 'Gold-Silber-Rechner.exe'
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowIcons {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern IntPtr SendMessage(IntPtr hwnd, uint msg, IntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadImage(IntPtr instance, string path, uint type, int w, int h, uint flags);
              [DllImport("user32.dll")]
              public static extern int GetSystemMetrics(int index);
              [DllImport("user32.dll")]
              public static extern bool DestroyIcon(IntPtr icon);
          }
          '@
          function Get-IconPixels($icon) {
            $bitmap = $icon.ToBitmap()
            try {
              $scaled = New-Object System.Drawing.Bitmap($bitmap, 16, 16)
              try {
                $pixels = for ($y = 0; $y -lt 16; $y++) {
                  for ($x = 0; $x -lt 16; $x++) { $scaled.GetPixel($x, $y).ToArgb() }
                }
                return ($pixels -join ',')
              } finally { $scaled.Dispose() }
            } finally { $bitmap.Dispose() }
          }
          $iconPath = (Resolve-Path 'gold-silber-icon.ico').Path
          $iconWidth = [WindowIcons]::GetSystemMetrics(49)
          $iconHeight = [WindowIcons]::GetSystemMetrics(50)
          $referenceHandle = [WindowIcons]::LoadImage([IntPtr]::Zero, $iconPath, 1, $iconWidth, $iconHeight, 0x10)
          if ($referenceHandle -eq [IntPtr]::Zero) { throw 'Could not load the reference title-bar icon' }
          $expectedIcon = Get-IconPixels ([System.Drawing.Icon]::FromHandle($referenceHandle))
          [WindowIcons]::DestroyIcon($referenceHandle) | Out-Null
          $titles = @{ de = 'Gold- und Silberrechner'; es = 'Calculadora de oro y plata'; en = 'Gold and Silver Calculator' }
          foreach ($language in @('de', 'es', 'en')) {
            $process = Start-Process -FilePath $exe -ArgumentList @('--lang', $language) -PassThru
            try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                Start-Sleep -Seconds 1
                $process.Refresh()
                if ($process.HasExited) { throw "Executable exited prematurely: $($process.ExitCode)" }
                $window = Get-Process -Name 'Gold-Silber-Rechner' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.MainWindowTitle -eq $titles[$language] }
                if ($window) { $ready = $true; break }
              }
              if (-not $ready) { throw "Expected application window was not found for $language" }
              $handle = [WindowIcons]::SendMessage($window[0].MainWindowHandle, 0x007F, [IntPtr]::Zero, [IntPtr]::Zero)
              if ($handle -eq [IntPtr]::Zero) { throw "Missing application window icon for $language" }
              $icon = [System.Drawing.Icon]::FromHandle($handle)
              if ((Get-IconPixels $icon) -ne $expectedIcon) { throw "Incorrect title-bar icon for $language (actual: $($icon.Size), expected: ${iconWidth}x${iconHeight})" }
              Write-Output "PASS: standalone application window and GSR icon for $language"
            } finally {
              Get-Process -Name 'Gold-Silber-Rechner' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe } | Stop-Process -Force
            }
          }
          if ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion -ne '2.4') {
            throw 'Incorrect embedded version metadata'
          }
      - name: Name executable and calculate checksum
        shell: pwsh
        run: |
          Move-Item dist/Gold-Silber-Rechner.exe 'dist/${{ matrix.filename }}'
          Get-FileHash 'dist/${{ matrix.filename }}' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Gold-Silver-Calculator-2.4-${{ matrix.target }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
