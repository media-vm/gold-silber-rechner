name: Publish signed Windows 11 executable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y osslsigncode
      - name: Check file identity and extract pinned signing certificate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, subprocess
          content = Path('downloads/Gold-Silber-Rechner-2.2.exe').read_bytes()
          assert hashlib.sha256(content).hexdigest() == '1b82765ede4c1d3addca9e2700e935ab264bebe1df4fe65210a5aaa0bfba4b2f'
          pe = struct.unpack_from('<I', content, 0x3c)[0]
          assert content[pe:pe+4] == b'PE\0\0'
          assert struct.unpack_from('<H', content, pe+4)[0] == 0x8664
          optional = pe + 24
          assert struct.unpack_from('<H', content, optional)[0] == 0x20b
          offset, size = struct.unpack_from('<II', content, optional+112+4*8)
          assert offset and size and offset+size <= len(content)
          length, revision, kind = struct.unpack_from('<IHH', content, offset)
          assert revision == 0x200 and kind == 2 and 8 < length <= size
          Path('/tmp/signature.p7b').write_bytes(content[offset+8:offset+length])
          certificates = subprocess.check_output(['openssl', 'pkcs7', '-inform', 'DER', '-in', '/tmp/signature.p7b', '-print_certs'], text=True)
          expected = '5F2BD8D34D846C0197AC5A58343B6FDD407DE639'
          found = False
          for part in certificates.split('-----BEGIN CERTIFICATE-----')[1:]:
              pem = '-----BEGIN CERTIFICATE-----' + part.split('-----END CERTIFICATE-----')[0] + '-----END CERTIFICATE-----\n'
              fingerprint = subprocess.check_output(['openssl', 'x509', '-noout', '-sha1', '-fingerprint'], input=pem, text=True).strip().split('=')[-1].replace(':', '')
              if fingerprint == expected:
                  Path('/tmp/pinned-signer.pem').write_text(pem)
                  found = True
          assert found, 'Expected owner signing certificate not found'
          PY
      - name: Verify Authenticode signature and timestamp
        run: |
          set +e
          osslsigncode verify -CAfile /tmp/pinned-signer.pem -TSA-CAfile /etc/ssl/certs/ca-certificates.crt -in downloads/Gold-Silber-Rechner-2.2.exe > "$RUNNER_TEMP/signature-check.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/signature-check.log"
          python3 - "$RUNNER_TEMP/signature-check.log" "$result" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          level = 'notice' if sys.argv[2] == '0' else 'error'
          print('::' + level + '::' + log[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          exit "$result"
      - name: Publish the exact signed executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v2.2 downloads/Gold-Silber-Rechner-2.2.exe --clobber
