name: Publish Snap 2.2 to Snap Store

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Only verify the public stable channel without uploading
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snap-store-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Snap Store credentials
        if: ${{ !inputs.verify_only }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo '::error::Missing repository secret SNAPCRAFT_STORE_CREDENTIALS. Add Snapcraft export-login credentials scoped to gold-silber-rechner with package_push and package_release permissions.'
            exit 1
          fi
      - name: Download verified release package
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v2.2 --pattern gold-silber-rechner_2.2_amd64.snap
          echo 'bec2486b06c47eb1a79243e6611dabf61693ae1041f92aaf7a53793549efc504  gold-silber-rechner_2.2_amd64.snap' | sha256sum --check
      - name: Install Snapcraft
        if: ${{ !inputs.verify_only }}
        run: sudo snap install snapcraft --classic
      - name: Upload and release to stable
        if: ${{ !inputs.verify_only }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload gold-silber-rechner_2.2_amd64.snap --release=stable
      - name: Verify public stable channel
        run: |
          python3 - <<'PYVERIFY'
          import json, urllib.request
          request = urllib.request.Request(
              'https://api.snapcraft.io/v2/snaps/info/gold-silber-rechner',
              headers={'Snap-Device-Series': '16', 'Snap-Device-Architecture': 'amd64'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          channels = data.get('channel-map', [])
          stable = [entry for entry in channels
                    if entry['channel']['name'] == 'stable'
                    and entry['channel']['architecture'] == 'amd64'
                    and entry['channel']['track'] == 'latest']
          assert stable, 'No public latest/stable channel for amd64'
          for entry in stable:
              print('::notice::Public amd64 latest/stable: version '
                    + entry['version'] + ', revision ' + str(entry['revision']))
              assert entry['version'] == '2.2', 'Public stable channel is not version 2.2'
          PYVERIFY
