name: Build ARM64 Snap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-snap:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Refresh Ubuntu package indexes
        run: sudo apt-get update
      - name: Build ARM64 Snap
        run: |
          set +e
          sudo snapcraft pack --destructive-mode > "$RUNNER_TEMP/snapcraft.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/snapcraft.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/snapcraft.log" <<'PYLOG'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text()[-12000:]
          log = log.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Snapcraft build failure::' + log)
          PYLOG
          fi
          exit "$result"
      - name: Upload ARM64 Snap as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-silber-rechner-2.2-arm64
          path: gold-silber-rechner_2.2_arm64.snap
          if-no-files-found: error
